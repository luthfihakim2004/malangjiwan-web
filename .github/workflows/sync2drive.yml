name: Sync to Google Drive

on:
  push:
    branches:
      - master

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Zip Repository Files
        run: |
          zip -r source-code-web.zip . -x "*.git*" "vendor/*" "node_modules/*"

      # Step 2: Upload the clean zip archive directly to Google Drive
      - name: Upload Zip to Google Drive
        uses: adityak74/google-drive-upload-git-action@main
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          folderId: "1yP7YMtMQm394_YP3pkuBCWEqhxnqSBaj"
          filename: "source-code-web.zip"
          overwrite: "true"
